<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVerse Academy — Sign Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/gameverse-neon.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-logo">
            <span class="emoji">🚀</span>
            <h1>Sign Up</h1>
        </div>

        <p class="meta" style="text-align:center; margin-bottom:28px;">
            Créez votre compte GameVerse Academy
        </p>

        <div id="error-message" class="error" style="display:none;">
            <i class="bi bi-exclamation-triangle"></i> <span id="error-text">Erreur</span>
        </div>

        <form action="SignupController" method="post" onsubmit="return validateForm()">
            <div class="form-group">
                <label><i class="bi bi-envelope"></i> Email</label>
                <input type="email" name="email" id="email" placeholder="votre@email.com" required>
            </div>

            <div class="form-group">
                <label><i class="bi bi-lock"></i> Password <span style="color:var(--text-dim);font-size:10px;">(min. 6 caractères)</span></label>
                <input type="password" name="password" id="password" placeholder="••••••••" minlength="6" required>
            </div>

            <div class="form-group">
                <label><i class="bi bi-lock-fill"></i> Confirmer le password</label>
                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-person-plus"></i> Créer mon compte
            </button>
        </form>

        <p class="auth-link">
            Déjà un compte ? <a href="index.html">Se connecter</a>
        </p>

    </div>
</div>

<script>
// Validation côté client : vérifier que les passwords correspondent
function validateForm() {
    const pwd = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const errorBox = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');

    if (pwd !== confirm) {
        errorText.textContent = 'Les mots de passe ne correspondent pas.';
        errorBox.style.display = 'block';
        return false;
    }
    return true;
}

// Affiche le message d'erreur renvoyé par le serveur (?error=...)
const params = new URLSearchParams(window.location.search);
const errorParam = params.get('error');
if (errorParam) {
    const errorBox = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');

    let message = errorParam;
    if (errorParam === 'mismatch') message = 'Les mots de passe ne correspondent pas.';
    else if (errorParam === 'db') message = 'Erreur serveur. Réessayez plus tard.';

    errorText.textContent = decodeURIComponent(message);
    errorBox.style.display = 'block';
}
</script>

</body>
</html>
