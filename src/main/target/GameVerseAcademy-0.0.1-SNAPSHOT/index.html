<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GameVerse Academy – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a1a;
      --surface:   #242424;
      --border:    #333;
      --gold:      #f0a500;
      --gold-dark: #c88a00;
      --text:      #e8e8e8;
      --muted:     #888;
      --input-bg:  #f0f0f0;
      --input-text:#111;
      --radius:    6px;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Barlow', sans-serif;
      color: var(--text);
    }

    /* subtle grid texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(240,165,0,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240,165,0,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 40px 36px 32px;
      position: relative;
      box-shadow: 0 8px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(240,165,0,.08);
      animation: slideUp .45s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* gold accent bar */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      border-radius: 10px 10px 0 0;
    }

    .headline {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: .03em;
      margin-bottom: 28px;
    }

    .headline strong {
      color: var(--text);
      font-weight: 700;
    }

    .error-msg {
      background: rgba(220, 53, 69, 0.15);
      border: 1px solid rgba(220, 53, 69, 0.4);
      color: #ff6b7a;
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: .88rem;
      margin-bottom: 20px;
    }

    /* ---- Field ---- */
    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--input-bg);
      color: var(--input-text);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 13px 44px 13px 14px;
      font-size: .95rem;
      font-family: 'Barlow', sans-serif;
      outline: none;
      transition: border-color .2s;
    }

    input:focus {
      border-color: var(--gold);
    }

    .eye-btn {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; padding: 4px;
      color: var(--muted);
      transition: color .2s;
    }
    .eye-btn:hover { color: var(--gold); }

    /* ---- Forgot ---- */
    .forgot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .forgot svg { flex-shrink: 0; }

    .forgot a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      transition: color .2s;
    }
    .forgot a:hover { color: var(--gold-dark); text-decoration: underline; }

    /* ---- Button ---- */
    .btn-login {
      width: 100%;
      background: var(--gold);
      color: #111;
      border: none;
      border-radius: var(--radius);
      padding: 15px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s, transform .1s, box-shadow .2s;
      box-shadow: 0 4px 18px rgba(240,165,0,.25);
    }

    .btn-login:hover  { background: #e09900; box-shadow: 0 6px 24px rgba(240,165,0,.38); }
    .btn-login:active { transform: scale(.98); }

    /* ---- Remember ---- */
    .remember {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      font-size: .88rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] { display: none; }

    .custom-check {
      width: 18px; height: 18px;
      background: var(--gold);
      border-radius: 3px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background .2s;
    }

    .custom-check svg { display: block; }

    .remember input:not(:checked) ~ .custom-check {
      background: var(--border);
    }

    /* ---- Divider ---- */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 22px 0;
    }

    /* ---- Cancel ---- */
    .btn-cancel {
      width: 100%;
      background: none;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px;
      font-family: 'Barlow', sans-serif;
      font-size: .92rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .2s, color .2s;
    }
    .btn-cancel:hover { border-color: var(--muted); color: var(--text); }
  </style>
</head>
<body>

<div class="card">
  <p class="headline">You need to <strong>log in</strong> before continuing.</p>

  <div id="msg-empty" class="error-msg" hidden>
    Veuillez renseigner le login et le mot de passe.
  </div>

  <form action="LoginController" method="post">

    <div class="field">
      <label for="login">Login (email)</label>
      <div class="input-wrap">
        <input type="text"
               id="login"
               name="login"
               placeholder="Email ou nom d'utilisateur"
               autocomplete="username"
               required />
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password"
               id="password"
               name="password"
               placeholder="Mot de passe"
               autocomplete="current-password"
               required />
        <button class="eye-btn" id="togglePwd" aria-label="Afficher le mot de passe" type="button">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <p class="forgot">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      Forgot your <a href="#">Password?</a>
    </p>

    <button class="btn-login" type="submit">LOG IN</button>

    <label class="remember">
      <input type="checkbox" id="remember" name="remember" checked/>
      <span class="custom-check">
        <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
          <path d="M1 4L4.5 7.5L10 1" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      Remember me
    </label>

    <div class="divider"></div>

    <button class="btn-cancel" type="button" onclick="history.back()">Cancel</button>
  </form>
</div>

<script>
  if (new URLSearchParams(window.location.search).get('error') === '1') {
    document.getElementById('msg-empty').hidden = false;
  }

  const pwd  = document.getElementById('password');
  const btn  = document.getElementById('togglePwd');
  const icon = document.getElementById('eyeIcon');

  btn.addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    icon.innerHTML = show
      ? `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
         <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
         <line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7S1 12 1 12z"/>
         <circle cx="12" cy="12" r="3"/>`;
  });

  const chk = document.getElementById('remember');
  const box = chk.nextElementSibling;
  chk.addEventListener('change', () => {
    box.style.background = chk.checked ? 'var(--gold)' : 'var(--border)';
  });
</script>
</body>
</html>
