name: CI/CD Pipeline — GameVerse Academy

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  ARTIFACT_ID: 'GameVerseAcademy'
  GROUP_ID: 'ma.ac.esi'
  VERSION: '0.0.1-SNAPSHOT'

jobs:
  build:
    name: 🔨 Build & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile project
        run: mvn clean compile -B --no-transfer-progress

      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: target/classes/
          retention-days: 1

  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: mvn test -B --no-transfer-progress

      - name: Publish JUnit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

      - name: Send email on test failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_HOST }}
          server_port: ${{ secrets.MAIL_SMTP_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [CI FAILURE] Tests échoués — GameVerse Academy @ ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: GameVerse CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            🔴 ÉCHEC DES TESTS — GameVerse Academy

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            Projet  : GameVerse Academy (ma.ac.esi)
            Version : 0.0.1-SNAPSHOT
            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Auteur  : ${{ github.actor }}
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            Des tests ont échoué. Consultez les logs pour corriger.

            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  package:
    name: 📦 Package (JAR)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build shaded JAR
        run: mvn package -DskipTests -B --no-transfer-progress

      - name: Rename WAR to JAR (shade plugin output)
        run: |
          mv target/GameVerseAcademy-0.0.1-SNAPSHOT.war target/GameVerseAcademy-0.0.1-SNAPSHOT.jar
          ls -lh target/*.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameVerseAcademy-jar
          path: target/GameVerseAcademy-*.jar
          retention-days: 30

      - name: Send email on package failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_HOST }}
          server_port: ${{ secrets.MAIL_SMTP_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [CI FAILURE] Packaging échoué — GameVerse Academy @ ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: GameVerse CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            🔴 ÉCHEC DU PACKAGING — GameVerse Academy

            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Auteur  : ${{ github.actor }}

            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  publish:
    name: 🚀 Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21 with GitHub Packages
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build shaded JAR
        run: mvn package -DskipTests -B --no-transfer-progress

      - name: Rename WAR to JAR for deployment
        run: mv target/GameVerseAcademy-0.0.1-SNAPSHOT.war target/GameVerseAcademy-0.0.1-SNAPSHOT.jar

      - name: Deploy JAR to GitHub Packages
        run: |
          mvn deploy:deploy-file \
            -Dfile=target/GameVerseAcademy-0.0.1-SNAPSHOT.jar \
            -DgroupId=ma.ac.esi \
            -DartifactId=GameVerseAcademy \
            -Dversion=0.0.1-SNAPSHOT \
            -Dpackaging=jar \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/${{ github.repository }} \
            -B --no-transfer-progress
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_HOST }}
          server_port: ${{ secrets.MAIL_SMTP_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [CI SUCCESS] GameVerse Academy v0.0.1-SNAPSHOT publié sur GitHub Packages"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: GameVerse CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            ✅ PUBLICATION RÉUSSIE — GitHub Packages

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            Projet   : GameVerse Academy
            GroupId  : ma.ac.esi
            Version  : 0.0.1-SNAPSHOT
            Branche  : ${{ github.ref_name }}
            Commit   : ${{ github.sha }}
            Auteur   : ${{ github.actor }}
            Registry : https://github.com/${{ github.repository }}/packages
            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            L'artefact JAR est disponible dans GitHub Packages.

            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_HOST }}
          server_port: ${{ secrets.MAIL_SMTP_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [CI FAILURE] Publication GitHub Packages échouée — GameVerse Academy"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: GameVerse CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            🔴 ÉCHEC DE LA PUBLICATION — GitHub Packages

            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Auteur  : ${{ github.actor }}

            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
